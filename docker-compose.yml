# OPTION A - everything runs on your PC (MongoDB + Redis + API + workers + UI). No accounts needed.
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"] # replica set is required for Change Streams
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try{rs.status().ok}catch(e){rs.initiate({_id:''rs0'',members:[{_id:0,host:''mongo:27017''}]}).ok}"',
        ]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./server
    environment: &env
      MONGO_URI: mongodb://mongo:27017/aditydb?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      MONGO_DB: ${MONGO_DB:-aditydb}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-please}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-50}
      ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-true}
    ports: ["4000:4000"]
    restart: on-failure
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: ./server
    command: ["node", "src/worker.js"]
    environment: *env
    deploy: { replicas: 2 }
    restart: on-failure
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports: ["8080:80"]
volumes:
  mongo-data:
